# Example /config/go2rtc.yaml for an Aqara G410 (go2rtc 1.9.9, Home Assistant).
# Replace the placeholders: RTSP user/password from the Aqara app, IP of the doorbell.
# Background for every setting: docs/stream.md
streams:
  klingel_udp:
    # Source 1: video + audio FROM the doorbell.
    #  - input template with wall-clock timestamps (the G410 sometimes sends timestamps running backwards)
    #  - re-encoded smaller with one keyframe per second -> fast start for every viewer
    #  - AAC kept for MSE/MP4, Opus added for WebRTC, both in ONE step
    - ffmpeg:rtsp://RTSP_USER:RTSP_PASS@192.168.1.50:8554/ch1#input=rtsp_tcp_wallclock#video=klingel_h264#width=960#height=720#audio=copy#audio=opus
    # Source 2: back channel TO the doorbell (two-way talk). go2rtc starts the script only while a
    # client sends microphone audio (WebRTC) or via API ?dst=klingel_udp. No second RTSP session.
    # Optional 2nd argument = gain factor (default 4.0), e.g. "... 192.168.1.50 2.5#backchannel=1"
    - exec:python3 /config/scripts/klingel_sprechen.py 192.168.1.50#backchannel=1

ffmpeg:
  # No "nobuffer": it drops the keyframe read while probing and waits for the next one.
  rtsp_tcp_wallclock: "-fpsprobesize 0 -fflags genpts+discardcorrupt -flags low_delay -use_wallclock_as_timestamps 1 -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_transport tcp -i {input}"
  # Alternative for a weak Wi-Fi link (see docs/stream.md): #input=rtsp_udp_wallclock
  rtsp_udp_wallclock: "-fpsprobesize 0 -fflags genpts+discardcorrupt -flags low_delay -use_wallclock_as_timestamps 1 -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_transport udp -i {input}"
  klingel_h264: "-c:v libx264 -r 15 -g:v 15 -preset:v superfast -tune:v zerolatency -profile:v main -level:v 3.1 -pix_fmt:v yuv420p -b:v 1200k -maxrate:v 1500k -bufsize:v 1500k"
